x-coverage:
  state: gated
  reason: customer-only-docs
  detail: >-
    Amobee is now operated as Nexxen and its developer surface went with the
    rebrand — the Platform API reference at services.amobee.com/campaign/v3/doc/
    returns 404 while the OAuth token endpoint and DSP console still serve existing
    customers, and the remaining reference lives in a Zendesk help center that
    refuses anonymous requests (403, Help Center API 401).
  evidence:
    - url: https://services.amobee.com/campaign/v3/doc/
      status: 404
    - url: https://help.amobee.com/hc/en-us
      status: 403
    - url: https://help.amobee.com/api/v2/help_center/en-us/categories.json
      status: 401
    - url: https://services.amobee.com/accounts/v1/api/token
      status: 405
    - url: https://services.amobee.com/v3/api-docs
      status: 200
  checked: '2026-08-12'
