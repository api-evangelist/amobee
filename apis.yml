  - aid: amobee:amobee-services-gateway-api
    name: Amobee Services Gateway API
    description: >-
      Public utility surface served by the Amobee services gateway at
      services.amobee.com — the IAB TCF vendor device-storage disclosure document,
      a request/IP echo endpoint and a health check. It is the only Amobee API with
      a live machine-readable contract: an OpenAPI 3.1.0 document is served at
      https://services.amobee.com/v3/api-docs and was captured verbatim on
      2026-08-12. It is NOT the Amobee Platform (Campaign) API — that reference was
      withdrawn (services.amobee.com/campaign/v3/doc/ returns 404).
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
