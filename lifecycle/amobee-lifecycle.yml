summary: >-
  Amobee is no longer an operating brand. www.amobee.com now serves a holding page
  titled "Amobee is now Nexxen!" pointing at nexxen.com (Amobee was acquired by
  Tremor International in 2022; Tremor rebranded to Nexxen in 2023). The platform
  itself is still running for existing customers — the services gateway, the OAuth
  token endpoint and the DSP console all answer — but the public developer surface
  has been withdrawn.
