error_envelope:
  format: proprietary JSON (not RFC 9457 / application/problem+json)
  content_type: application/json
  fields:
    - name: timestamp
      description: ISO 8601 timestamp of the failed request
    - name: path
      description: request path that failed
    - name: status
      description: numeric HTTP status, repeated in the body
    - name: error
      description: HTTP reason phrase (Not Found, Internal Server Error)
    - name: requestId
      description: gateway-assigned correlation id
  example: '{"timestamp":"2026-08-12T16:48:19.345Z","path":"/","status":404,"error":"Not Found","requestId":"4de2f694-3498985"}'
  oauth_variant:
    note: >-
      The token endpoint uses the OAuth 2.0 error shape instead, nulling the token
      fields alongside it.
    example: '{"access_token":null,"token_type":null,"expires_in":null,"error":"invalid_request","error_description":"Unable to parse authorization basic token."}'
  see: errors/amobee-problem-types.yml
